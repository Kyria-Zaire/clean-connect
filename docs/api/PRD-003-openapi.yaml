    # ----- Inputs : Photos ------------------------------------------------

    PhotoGpsInput:
      # Zod : `photoGpsInputSchema`
      type: object
      required: [gpsLatitude, gpsLongitude]
      additionalProperties: false
      properties:
        gpsLatitude:
          oneOf:
            - { type: number, minimum: -90, maximum: 90 }
            - { type: 'null' }
        gpsLongitude:
          oneOf:
            - { type: number, minimum: -180, maximum: 180 }
            - { type: 'null' }
        gpsAccuracyMeters:
          oneOf:
            - { type: integer, minimum: 0, maximum: 10000 }
            - { type: 'null' }
      description: |
        `gpsLatitude` et `gpsLongitude` doivent être **tous deux** renseignés ou
        **tous deux** NULL (cohérence vérifiée serveur — code `PHOTO_GPS_INCONSISTENT`).
        `gpsAccuracyMeters` interdit si lat/lng sont NULL.

    PresignPhotoUploadInput:
      # Zod : `presignPhotoUploadInputSchema`
      type: object
      required: [missionId, phase, variant, captureClientUuid, bytes, mimeType, gps]
      additionalProperties: false
      properties:
        missionId:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: |
            **Doit strictement égaler** l'`{id}` du path (revue CTO Ticket 3.3 — anti
            redirection cross-mission depuis le body). Sinon → `409 PHOTO_UPLOAD_SESSION_MISSION_MISMATCH`.
        phase: { $ref: '#/components/schemas/PhotoType' }
        variant: { $ref: '#/components/schemas/PhotoVariant' }
        captureClientUuid:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: |
            UUID v4 généré côté mobile. **Obligatoire au presign** (revue CTO).
            Stocké côté serveur sur la `PhotoUploadSession` (lien logique capture ↔ session).
            Sert à apparier ORIGINAL/DISPLAY et à garantir l'idempotence d'upload.
        bytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Taille en bytes (max 10 Mo, ADR-009).
        mimeType: { $ref: '#/components/schemas/PhotoMimeType' }
        gps: { $ref: '#/components/schemas/PhotoGpsInput' }

    ConfirmPhotoUploadInput:
      # Zod : `confirmPhotoUploadInputSchema`
      type: object
      required:
        - photoUploadSessionId
        - sessionToken
        - photoId
        - captureClientUuid
        - cloudinaryPublicId
        - checksumSha256
        - imageWidth
        - imageHeight
        - bytes
        - mimeType
        - gps
      additionalProperties: false
      properties:
        photoUploadSessionId: { $ref: '#/components/schemas/Uuid' }
        sessionToken:
          type: string
          minLength: 32
          maxLength: 128
          description: |
            **Bearer-équivalent** de la session d'upload (PRD-003 Ticket 3.3).
            Le mobile renvoie le **token clair** reçu une seule fois au presign.
            Le serveur recalcule `sha256(sessionToken)` et compare au `tokenDigest`
            stocké en DB pour authentifier la session — protège contre les attaques
            par énumération d'`id` de session (anti session-id leak).

            **Sécurité** :
            - Jamais loggé (Pino redactor `*.sessionToken`).
            - Pas de stockage côté serveur (digest only).
            - Mismatch → `409 PHOTO_UPLOAD_SESSION_ALREADY_CONSUMED` (sémantique
              « session non trouvée », sans révéler si l'`id` existait ou non).
        photoId:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: |
            **UUID v4 généré côté mobile** (offline-first PRD-003 Ticket 3.3).
            Le mobile DOIT réutiliser le **même** `photoId` à chaque retry après
            un échec réseau : l'idempotence forte est garantie côté DB via
            l'UNIQUE `(missionId, captureClientUuid, variant)` — pas via `photoId`.
            Si la même session a déjà produit une `Photo` pour ce `captureClientUuid`,
            la réponse renvoie `idempotent: true` avec le `photoId` initial.
        captureClientUuid:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: |
            Doit **strictement** égaler le `captureClientUuid` stocké sur la
            `PhotoUploadSession` identifiée par `photoUploadSessionId` (revue CTO).
            Croisé avec `{id}` mission dans l'URL : empêche upload **cross-session** et
            **cross-mission**. Sinon → `409 PHOTO_CAPTURE_CLIENT_UUID_SESSION_MISMATCH`.
        cloudinaryPublicId:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            Doit **strictement** égaler le `cloudinaryPublicId` figé serveur au
            presign (la session scelle le path Cloudinary). Mismatch → `422`.
        checksumSha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
        imageWidth: { type: integer, minimum: 1, maximum: 20000 }
        imageHeight: { type: integer, minimum: 1, maximum: 20000 }
        bytes:
          type: integer
          minimum: 1
          maximum: 10485760
        mimeType: { $ref: '#/components/schemas/PhotoMimeType' }
        gps: { $ref: '#/components/schemas/PhotoGpsInput' }

    ConfirmPhotoUploadResponse:
      # Zod : `confirmPhotoUploadResponseSchema`
      type: object
      required:
        - photoId
        - missionId
        - phase
        - variant
        - captureClientUuid
        - bytes
        - imageWidth
        - imageHeight
        - gpsMissing
        - syncedAt
        - idempotent
      additionalProperties: false
      properties:
        photoId:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: |
            ID de la `Photo` persistée. Si `idempotent: true`, c'est l'ID de la
            photo initiale (le `photoId` du body est ignoré au profit du premier).
        missionId: { $ref: '#/components/schemas/Uuid' }
        phase: { $ref: '#/components/schemas/PhotoType' }
        variant: { $ref: '#/components/schemas/PhotoVariant' }
        captureClientUuid: { $ref: '#/components/schemas/Uuid' }
        bytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: |
            Source de vérité **Cloudinary** (`getResource`), pas le report mobile.
        imageWidth: { type: integer, minimum: 1, maximum: 20000 }
        imageHeight: { type: integer, minimum: 1, maximum: 20000 }
        gpsMissing:
          type: boolean
          description: |
            `true` si GPS non fourni (lat+lng tous deux NULL au presign).
            Audit interne — mission **non bloquée** (décision CTO Q3).
        syncedAt: { $ref: '#/components/schemas/IsoDateTime' }
        idempotent:
          type: boolean
          description: |
            **Sémantique HTTP** : la route répond toujours **`201 Created`** que ce soit
            une première insertion (`false`) ou un **replay** (`true`).

            - `false` : première confirmation — création `Photo` + `consumedAt` sur la session.
            - `true` : une `Photo` existait déjà pour `(missionId, captureClientUuid, variant)` —
              le serveur renvoie l'état déjà persisté **sans** second insert ni effet de bord.
              Cas d'usage : crash app après succès, **timeout** lors du premier `confirm`,
              double tap réseau. Aligné ajustement CTO post-Ticket 3.3 (doc explicite replay).

    # ----- Public views : Photos ------------------------------------------

    PublicPhoto:
      # Zod : `publicPhotoSchema`
      type: object
      required:
        - id
        - missionId
        - type
        - variant
        - signedUrl
        - signedUrlExpiresAt
        - imageWidth
        - imageHeight
        - gpsLatitude
        - gpsLongitude
        - gpsAccuracyMeters
        - gpsMissing
        - capturedAt
        - syncedAt
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        missionId: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/PhotoType' }
        variant: { $ref: '#/components/schemas/PhotoVariant' }
        signedUrl:
          type: string
          format: uri
          description: Signed URL Cloudinary (5 min). Régénérée à chaque GET.
        signedUrlExpiresAt: { $ref: '#/components/schemas/IsoDateTime' }
        imageWidth:
          oneOf:
            - { type: integer, minimum: 1, maximum: 20000 }
            - { type: 'null' }
        imageHeight:
          oneOf:
            - { type: integer, minimum: 1, maximum: 20000 }
            - { type: 'null' }
        gpsLatitude:
          oneOf:
            - { type: number, minimum: -90, maximum: 90 }
            - { type: 'null' }
        gpsLongitude:
          oneOf:
            - { type: number, minimum: -180, maximum: 180 }
            - { type: 'null' }
        gpsAccuracyMeters:
          oneOf:
            - { type: integer, minimum: 0, maximum: 10000 }
            - { type: 'null' }
        gpsMissing: { type: boolean }
        capturedAt: { $ref: '#/components/schemas/IsoDateTime' }
        syncedAt:
          oneOf:
            - { $ref: '#/components/schemas/IsoDateTime' }
            - { type: 'null' }

    AdminPhotoView:
      # Zod : `adminPhotoViewSchema`
      allOf:
        - { $ref: '#/components/schemas/PublicPhoto' }
        - type: object
          required: [cloudinaryPublicId, checksumSha256, flagSuspicious, deletedAt]
          additionalProperties: false
          properties:
            cloudinaryPublicId: { type: string, minLength: 1, maxLength: 1024 }
            checksumSha256:
              type: string
              minLength: 64
              maxLength: 64
              pattern: '^[0-9a-f]{64}$'
            flagSuspicious: { type: boolean }
            deletedAt:
              oneOf:
                - { $ref: '#/components/schemas/IsoDateTime' }
                - { type: 'null' }

    PhotoUploadSignatureResponse:
      # Zod : `photoUploadSignatureResponseSchema`
      type: object
      required:
        - photoUploadSessionId
        - sessionToken
        - uploadUrl
        - cloudinaryParams
        - expiresAt
        - maxBytes
        - allowedMimeTypes
      additionalProperties: false
      properties:
        photoUploadSessionId: { $ref: '#/components/schemas/Uuid' }
        sessionToken:
          type: string
          minLength: 32
          maxLength: 128
          description: |
            **Token clair de la session — retourné UNE SEULE FOIS** (PRD-003 Ticket 3.3).

            - Généré par `crypto.randomBytes` côté serveur (base64-url, ≥ 256 bits d'entropie).
            - Le serveur stocke uniquement `sha256(sessionToken)` (`tokenDigest` UNIQUE en DB).
            - Le mobile DOIT le **conserver en mémoire** pour `POST /photos/confirm`.
            - **Non récupérable** : si le mobile le perd (kill app), la session est inutilisable
              jusqu'à expiration (`expiresAt`) — il faut rejouer le presign.
            - **Jamais loggé** (Pino redactor `*.sessionToken` + `*.tokenDigest`).

            Ce token authentifie la session au `/confirm` (mismatch → `409`).
        uploadUrl:
          type: string
          format: uri
          description: |
            URL Cloudinary direct (`https://api.cloudinary.com/v1_1/<cloud>/image/upload`).
            Le mobile upload directement en multipart, sans transiter par l'API.
        cloudinaryParams:
          type: object
          additionalProperties: { type: string }
          description: |
            Paramètres signés Cloudinary à intégrer au multipart (timestamp, signature,
            folder, public_id, type=private, etc.). **Confidentiel — jamais loggé**
            (filter Pino `*.cloudinaryParams.signature`, `*.api_key`).

            **Format livré (Ticket 3.3)** : `{ uploadUrl, cloudName, apiKey, publicId,
            folder, type, timestamp, signature, signatureAlgorithm, mimeType, maxBytes }`.
            `signatureAlgorithm` = `sha1` (Cloudinary SDK), pas `sha256`.
        expiresAt:
          allOf: [{ $ref: '#/components/schemas/IsoDateTime' }]
          description: |
            Expiration de la session (= `PHOTO_UPLOAD_SESSION_TTL_SECONDS`, défaut 300 s).
            Cloudinary applique sa propre validité côté signature multipart.
        maxBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        allowedMimeTypes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PhotoMimeType' }

    PublicPhotoListResponse:
      # Zod : `publicPhotoListResponseSchema`
      type: object
      required: [items, counts]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicPhoto' }
        counts:
          type: object
          required: [BEFORE, AFTER]
          additionalProperties: false
          properties:
            BEFORE: { type: integer, minimum: 0 }
            AFTER: { type: integer, minimum: 0 }

    PaginatedAdminPhotosResponse:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPhotoView' }
        nextCursor:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }

    # ----- Admin views : Webhooks + Auto-release --------------------------

    AdminStripeWebhookEventView:
      # Zod : `adminStripeWebhookEventViewSchema`
      type: object
      required:
        - stripeEventId
        - type
        - livemode
        - processingStatus
        - createdAt
        - processingStartedAt
        - processedAt
        - lastError
      additionalProperties: false
      properties:
        stripeEventId: { type: string, maxLength: 255 }
        type: { type: string, maxLength: 120 }
        livemode: { type: boolean }
        processingStatus: { $ref: '#/components/schemas/StripeWebhookProcessingStatus' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
        processingStartedAt:
          oneOf:
            - { $ref: '#/components/schemas/IsoDateTime' }
            - { type: 'null' }
        processedAt:
