          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookErrorBody' }
        '422':
          description: '422 — `WEBHOOK_PAYLOAD_MALFORMED` (replay refusé).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookErrorBody' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

