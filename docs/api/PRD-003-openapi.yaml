  # ---------------------------------------------------------------------------
  # Bloc 3 — Webhooks (Stripe + Admin DLQ) (3 endpoints)
  # ---------------------------------------------------------------------------

  '/v1/webhooks/stripe':
    post:
      tags: [Webhooks]
      operationId: stripeWebhook
      summary: 'Endpoint Stripe — events webhook signés HMAC'
      description: |
        **Endpoint public**, authentifié uniquement par signature Stripe
        (`stripe-signature` header).

        Règles dures (audit `reviewer-securite-code`) :
        1. Vérification HMAC **avant** désérialisation (`stripe.webhooks.constructEvent`).
        2. Raw body obligatoire (`@Req() req: RawBodyRequest<Request>`).
        3. Idempotence DB via `stripe_webhook_events.stripe_event_id` (PK UNIQUE).
        4. Anti-replay via `payload_hash` SHA-256.
        5. Verrou applicatif (`SELECT … FOR UPDATE`) pour empêcher double traitement
           concurrent (audit Verify V1).
        6. Vérification `livemode` cohérent avec env serveur (PROD ne touche pas TEST).
        7. **Réponse `202` immédiate** (décision CTO) — traitement métier **asynchrone**
           (idempotence DB, `DomainEvent`, BullMQ). Stripe reçoit un 2xx rapide ; replay
           concurrent → `409 WEBHOOK_ALREADY_PROCESSED` ou `WEBHOOK_PROCESSING_LOCKED`.

        **Sécurité** : aucune réponse ne contient de payload renvoyé, pas de
        détails Stripe — uniquement `{ accepted: true }` minimal.
      x-rate-limit: { strategy: 'disabled', reason: 'Authentifié par signature HMAC Stripe.' }
      security:
        - stripeSignature: []
      requestBody:
        required: true
        description: |
          Stripe Event raw JSON (forme v2025-02-24.acacia). Validé Niveau 1
          (`stripeWebhookRawSchema`) après HMAC.
          **Aucun exemple de payload signé n'est documenté ici** (refus CTO :
          jamais d'exemple avec une vraie clé / vraie signature).
        content:
          application/json:
            schema:
              type: object
              description: Stripe Event raw (validation interne uniquement).
              additionalProperties: true
      responses:
        '202':
          description: |
            Event accepté pour traitement asynchrone (réponse rapide — décision CTO).
            Replay idempotent : `409 WEBHOOK_ALREADY_PROCESSED` si `stripe_event_id` déjà traité.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAccepted202Body' }
        '400':
          description: 'WEBHOOK_INVALID_SIGNATURE / WEBHOOK_PAYLOAD_MALFORMED / WEBHOOK_LIVEMODE_MISMATCH'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookErrorBody' }
        '409':
          description: 'WEBHOOK_ALREADY_PROCESSED / WEBHOOK_PROCESSING_LOCKED (idempotence)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookErrorBody' }

  '/v1/admin/webhooks/stripe':
    get:
      tags: [Webhooks (Admin)]
      operationId: adminListStripeWebhooks
      summary: '[ADMIN] Console événements webhook Stripe reçus'
      description: |
        Liste paginée des `StripeWebhookEvent` traités/en cours/échoués.
        **N'expose JAMAIS le `rawPayload`** (refus CTO — consulter en console DB).
