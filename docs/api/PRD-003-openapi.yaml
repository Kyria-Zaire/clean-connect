            Vaut true s'il existe des éléments après la fenêtre courante
            (offset + limit).

    # ----- Inputs : Mission completion ------------------------------------

    StartMissionInput:
      # Pas de body MVP — :id + JWT identifient tout.
      type: object
      additionalProperties: false

    CompleteMissionInput:
      type: object
      additionalProperties: false
      properties:
        prestataireNote:
          type: string
          maxLength: 1000
          description: Note libre prestataire (loggée dans `MissionEvent`, jamais facturée).

    ValidateMissionInput:
      # Zod : `validateMissionPaymentInputSchema` (vide MVP)
      type: object
      additionalProperties: false

    ReportProblemInput:
      type: object
      required: [category, description]
      additionalProperties: false
      properties:
        category:
          type: string
          enum:
            - DAMAGED_PROPERTY
            - INCOMPLETE_SERVICE
            - INAPPROPRIATE_BEHAVIOR
            - NO_SHOW
            - PAYMENT_ISSUE
            - OTHER
        description:
          type: string
          minLength: 10
          maxLength: 2000
        reportedBy:
          type: string
          enum: [CLIENT, PRESTATAIRE]
          description: Auto-déduit serveur via JWT — header informatif.

    # ----- Generic success bodies pour 202 / 204 ---------------------------

    WebhookAccepted202Body:
      type: object
      required: [accepted, idempotent, eventId]
      additionalProperties: false
      description: |
        Réponse **202** immédiate au webhook Stripe (décision CTO) : acquittement HTTP
        rapide ; le traitement métier (idempotence DB, `DomainEvent`, BullMQ) est **asynchrone**.

        **Clarification Build PRD-003 Ticket 3.1** : sur replay (`stripe_event_id` déjà
        en base, `P2002` Postgres), le serveur renvoie **202 avec `idempotent: true`**
        au lieu de `409 WEBHOOK_ALREADY_PROCESSED`. Justification : Stripe attend un
        `2xx` pour stopper sa boucle de retries (sinon retry 3 jours). Renvoyer 409
        sur replay créerait du bruit côté Dashboard Stripe sans valeur ajoutée
        (l'idempotence est déjà garantie côté DB).
      properties:
        accepted: { type: boolean, enum: [true] }
        idempotent:
          type: boolean
          description: '`true` si l''event a déjà été reçu/persisté (replay) ; `false` sur premier accept.'
        eventId:
          type: string
          maxLength: 255
          pattern: '^evt_'
          description: Echo du `stripe_event_id` (utile pour corrélation côté Stripe Dashboard / debug).

    AcceptedAsyncBody:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ACCEPTED] }
        message:
          type: string
          maxLength: 500
          description: Description du traitement asynchrone enclenché.

# =============================================================================
# Security global = JWT par défaut. Endpoints publics overrident `security: []`.
# =============================================================================

security:
  - bearerAuth: []

# =============================================================================
# Paths — 18 endpoints
# =============================================================================

paths:

  # ---------------------------------------------------------------------------
  # Bloc 1 — Payments (5 endpoints)
  # ---------------------------------------------------------------------------

  # Note : les responses 422 paiements peuvent retourner les codes `PaymentErrorCode`
  # (cf. `PaymentErrorBody`). Idem 422 photos → `PhotoErrorBody`, etc.
  # Documenté de façon globale via `GenericErrorBody.error` (référence textuelle).

  '/v1/payments/intent':
    post:
      tags: [Payments]
      operationId: createPaymentIntent
      summary: Créer un PaymentIntent Stripe pour une mission
      description: |
        **Flow client** : crée un PaymentIntent Stripe avec `capture_method='manual'`
        pour la mission ciblée. Retourne le `clientSecret` pour Stripe.js mobile.

        - Le montant est calculé **côté serveur** depuis le tarif mission (anti-tamper).
        - Idempotence : `Idempotency-Key` obligatoire. Une même clé renvoie la même
          réponse (cache 24 h).
        - État mission requis : `DRAFT` ou `PENDING_PAYMENT`. Sinon → `409 PAYMENT_INVALID_STATE`.

        ### Idempotency replay (ajustement CTO Ticket 3.2 #1 — mode `loose`)

        Quand un client rejoue la **même** `Idempotency-Key` sur la **même** mission :

        - L'API ne crée **PAS** un nouveau `PaymentIntent` Stripe (zéro double appel).
        - L'API peut **régénérer le `clientSecret`** côté serveur via
          `paymentIntents.retrieve(...)` (mode dit `loose` — par opposition au mode `strict`
          qui renverrait `null` pour forcer le mobile à conserver le secret initial).
        - **Dette `payments-client-secret-replay-strict-vs-loose`** ouverte : la décision
          finale (loose vs strict) sera tranchée en Verify V2.

        Conséquence mobile : si tu as **perdu** le `clientSecret` initial (kill app, restart
        device) et que la mission est toujours en `PENDING_PAYMENT`, tu peux **rejouer**
        ta requête `POST /v1/payments/intent` avec la **même** `Idempotency-Key` pour
        récupérer un `clientSecret` exploitable. **N'utilise PAS** une nouvelle clé tant
        que la mission n'est pas passée en `payment_failed` ou `canceled` — sinon le
        serveur répondra `409 PAYMENT_INVALID_STATE`.

        ### Retry après `payment_failed` / `payment_canceled` (ajustement CTO Ticket 3.2 #2)

        Si Stripe a émis `payment_intent.payment_failed` (carte refusée, 3DS abandonné) :

        - Le `Payment` côté DB est `FAILED` (statut terminal pour cet intent).
        - La mission **reste** en `PENDING_PAYMENT` (`AC-B.6` PRD-003).
        - Le client mobile DOIT effectuer une **nouvelle** requête `POST /v1/payments/intent`
          avec une **nouvelle** `Idempotency-Key` (UUID v4 régénéré côté mobile).
          Rejouer l'ancienne clé → `200/201` idempotent inutile car le PaymentIntent
          précédent est en `FAILED` côté Stripe.
        - Le serveur créera un **nouveau** `PaymentIntent` Stripe et renverra un
          nouveau `clientSecret`.

        Idem si la mission a transitionné en `CANCELLED` via `payment_intent.canceled`
        (notamment `authorization_expired`) : la mission n'est plus `PENDING_PAYMENT`,
        seul le client peut redémarrer un cycle de paiement depuis une nouvelle mission.
      x-rbac: [CLIENT]
      x-rate-limit: { strategy: 'token-bucket', max: 30, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntentInput' }
      responses:
        '201':
          description: PaymentIntent créé. `clientSecret` retourné (consommer immédiatement côté Stripe.js).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatePaymentIntentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '409 — `PAYMENT_INVALID_STATE` ou `PAYMENT_IDEMPOTENCY_CONFLICT`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentErrorBody' }
        '422':
          description: |
            422 — règle métier violée (cf. `PaymentErrorCode`) :
            `PAYMENT_AMOUNT_REQUIRED` (mission sans `estimatedPriceCents`),
            `PAYMENT_STRIPE_ERROR` (échec création Stripe).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentErrorBody' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: |
            `PAYMENTS_DISABLED` — feature flag `FF_PAYMENTS_ENABLED=false`
            sur cet environnement (PRD-003 Ticket 3.2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentErrorBody' }

  '/v1/payments/{id}/validate':
    post:
