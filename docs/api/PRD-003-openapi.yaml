        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------------------
  # Bloc 5 — Mission Completion (4 endpoints)
  # ---------------------------------------------------------------------------

  '/v1/missions/{id}/start':
    post:
      tags: [Mission Completion]
      operationId: startMission
      summary: '[PRESTATAIRE] Démarrer l''intervention (mission ACCEPTED → IN_PROGRESS)'
      description: |
        **Réservé au prestataire** (revue CTO).

        Précondition : ≥ 3 photos `BEFORE` valides / syncées.
        Sinon → `422 MISSING_REQUIRED_BEFORE_PHOTOS` (ou `PHOTO_INSUFFICIENT_BEFORE` selon implémentation).

        Met à jour `Mission.startedAt`, push notification client.
      x-rbac: [PRESTATAIRE]
      x-rate-limit: { strategy: 'token-bucket', max: 10, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeaderOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartMissionInput' }
      responses:
        '204': { description: 'Mission démarrée (no content).' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: '422 — `MISSING_REQUIRED_BEFORE_PHOTOS` ou règle photos (cf. codes).'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/MissionWorkflowErrorBody' }
                  - { $ref: '#/components/schemas/PhotoErrorBody' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  '/v1/missions/{id}/complete':
    post:
      tags: [Mission Completion]
      operationId: completeMission
      summary: '[PRESTATAIRE] Signaler la fin d''intervention (IN_PROGRESS → CLIENT_VALIDATION_PENDING)'
      description: |
        **Réservé au prestataire** (revue CTO). Signifie : le prestataire **a terminé**
        son passage sur site (pas une validation client).

        Préconditions :
        - Photos **AFTER** valides / syncées (quota ≥ 5 — CTO Q3). Sinon → `422` avec
          `PHOTO_INSUFFICIENT_AFTER` ou `AFTER_REQUIRES_BEFORE` si ordre métier violé
          (upload AFTER sans BEFORE minimum requis).
        - **Ne valide pas** la mission côté client : la mission passe en
          **`CLIENT_VALIDATION_PENDING`** (attente action client ou auto-release T+48h ouvrées).

        Déclenche le timer auto-release (`AutoReleaseJob.SCHEDULED`) et notifie le client.
      x-rbac: [PRESTATAIRE]
      x-rate-limit: { strategy: 'token-bucket', max: 10, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteMissionInput' }
      responses:
        '202':
          description: 'Mission complétée, validation client en attente.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedAsyncBody' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: '422 — `AFTER_REQUIRES_BEFORE`, `PHOTO_INSUFFICIENT_AFTER`, etc.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/MissionWorkflowErrorBody' }
                  - { $ref: '#/components/schemas/PhotoErrorBody' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  '/v1/missions/{id}/validate':
    post:
      tags: [Mission Completion]
      operationId: validateMissionByClient
      summary: '[CLIENT] Valider la mission terminée → déclenche capture + Transfer'
      description: |
        **Flow nominal de libération du séquestre** :
        1. Cancel `AutoReleaseJob` (verrou applicatif via `locked_at`).
        2. Stripe `paymentIntents.capture` (idempotency-key déterministe
           `capture-mission-{missionId}`).
        3. Création `Transfer` Connect (`PENDING` → webhook `transfer.paid` → `SENT`).
        4. Mission `COMPLETED`.

        Race conditions couvertes :
        - Double validation simultanée → 1 seule capture Stripe (idempotency key).
        - Validation pendant auto-release qui tourne → conflit `409`.
        - Autorisation carte expirée (Visa/MC ~7j) → `409 PAYMENT_AUTHORIZATION_EXPIRED`.
      x-rbac: [CLIENT]
      x-rate-limit: { strategy: 'token-bucket', max: 10, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateMissionInput' }
      responses:
        '202':
          description: 'Validation acceptée, capture + transfer en cours (asynchrone).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedAsyncBody' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '409 — conflit état / course ; inclut `PAYMENT_AUTHORIZATION_EXPIRED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentErrorBody' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------------------
  # Bloc 5b — Mission Status (RBAC) (2 endpoints lecture par rôle)
  # ---------------------------------------------------------------------------

  '/v1/missions/{id}/payment':
    get:
      tags: [Mission Status (RBAC)]
      operationId: getMissionPayment
      summary: '[CLIENT | ADMIN] Consulter le paiement de cette mission'
      description: |
        **Rôles autorisés : `CLIENT` et `ADMIN` uniquement** (revue CTO — pas de prestataire
        sur cet endpoint).

        Projection **déterministe sans ambiguïté** :
        - JWT **CLIENT** + ownership mission → corps **toujours** conforme à `ClientPaymentView`.
        - JWT **ADMIN** → corps **toujours** conforme à `AdminPaymentView`.

        Le prestataire consulte son reversement via `GET /v1/missions/{id}/transfer`.

        `404 PAYMENT_NOT_FOUND` si aucun paiement n'existe encore pour cette mission.
      x-rbac: [CLIENT, ADMIN]
      x-rate-limit: { strategy: 'token-bucket', max: 60, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
      responses:
        '200':
          description: |
            **Schéma exact selon le rôle** : `ClientPaymentView` (client) ou `AdminPaymentView` (admin).
            Le `oneOf` ci-dessous liste les deux formes possibles ; une seule est retournée par appel.
          content:
            application/json:
              schema:
                description: |
                  **Règle serveur** : exactement un des deux schémas — jamais les deux.
                  Pas de fusion ni de champ optionnel croisé.
                oneOf:
                  - { $ref: '#/components/schemas/ClientPaymentView' }
                  - { $ref: '#/components/schemas/AdminPaymentView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  '/v1/missions/{id}/transfer':
    get:
      tags: [Mission Status (RBAC)]
      operationId: getMissionTransferForPrestataireOrAdmin
      summary: '[PRESTATAIRE | ADMIN] Consulter le Transfer Connect de cette mission'
      description: |
        **Rôles autorisés : `PRESTATAIRE` et `ADMIN` uniquement** (revue CTO).

        Projection **déterministe sans ambiguïté** :
        - JWT **PRESTATAIRE** + mission ACCEPTED → **toujours** `PrestataireTransferView`.
        - JWT **ADMIN** → **toujours** `AdminTransferView`.

        Le client ne consulte **pas** les transfers sur cet endpoint (paiement côté client :
        `GET /v1/missions/{id}/payment`).

        `404 TRANSFER_NOT_FOUND` si aucun transfer n'existe encore (capture pas encore effectuée).
      x-rbac: [PRESTATAIRE, ADMIN]
      x-rate-limit: { strategy: 'token-bucket', max: 60, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
      responses:
        '200':
          description: |
            **Schéma exact selon le rôle** : `PrestataireTransferView` ou `AdminTransferView`.
          content:
            application/json:
              schema:
                description: |
                  **Règle serveur** : exactement un des deux schémas — jamais les deux.
                oneOf:
                  - { $ref: '#/components/schemas/PrestataireTransferView' }
                  - { $ref: '#/components/schemas/AdminTransferView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------------------
  # Bloc 6 — Auto-release (Admin) (1 endpoint observabilité V10)
  # ---------------------------------------------------------------------------

  '/v1/admin/auto-release-jobs':
    get:
      tags: [Auto-release (Admin)]
      operationId: adminListAutoReleaseJobs
      summary: '[ADMIN] Console jobs auto-release (V10 — verrou applicatif)'
      description: |
        Liste paginée des `AutoReleaseJob` (**offset / limit**, décision CTO). Permet de monitorer :
        - les jobs `SCHEDULED` (timer T+48h ouvrées en cours).
        - les jobs `RUNNING` avec `lockedAt`/`lockedBy` (debug verrou applicatif).
        - les jobs `FAILED` (`lastError` tronqué 500 chars).
        - les jobs `CANCELLED` (`cancelReason` audit : `dispute_opened` / `client_validated`).
        Audit Verify V10 : empêche double exécution simultanée.
      x-rbac: [ADMIN]
      x-rate-limit: { strategy: 'token-bucket', max: 60, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/AutoReleaseLimitQuery'
        - $ref: '#/components/parameters/AutoReleaseOffsetQuery'
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/AutoReleaseJobStatus' }
        - in: query
          name: missionId
          schema: { $ref: '#/components/schemas/Uuid' }
        - in: query
          name: isLocked
          schema: { type: boolean }
          description: 'Filtre les jobs avec `lockedAt IS NOT NULL`.'
      responses:
        '200':
          description: Liste paginée admin (offset/limit).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedAdminAutoReleaseJobsResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  '/v1/missions/{id}/report-problem':
    post:
      tags: [Mission Completion]
      operationId: reportMissionProblem
      summary: '[CLIENT | PRESTATAIRE] Ouvrir un litige sur la mission'
      description: |
        Bascule la mission en `DISPUTE_OPEN`.
        - Cancel l'`AutoReleaseJob` pendant (verrou + `cancelReason='dispute_opened'`).
        - Bloque toute libération de séquestre (audit Verify V11).
        - Notif admin pour traitement.
      x-rbac: [CLIENT, PRESTATAIRE]
      x-rate-limit: { strategy: 'token-bucket', max: 10, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportProblemInput' }
      responses:
        '202':
          description: 'Litige ouvert.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedAsyncBody' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
