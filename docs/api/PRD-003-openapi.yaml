        **`captureClientUuid` (revue CTO)** :
        - **Obligatoire** dans le corps ; UUID v4 généré côté mobile.
        - Persisté sur la `PhotoUploadSession` : relie logiquement presign → confirm
          et apparie ORIGINAL/DISPLAY (même valeur pour les deux variants).
        - À `confirm`, le serveur vérifie que `captureClientUuid` du body **égale**
          celui de la session **et** que la session appartient à la mission `{id}` URL
          (anti cross-session / cross-mission).

        Sécurité :
        - `mimeType` validé contre whitelist (`image/jpeg|png|heic|webp`).
        - `bytes` ≤ 10 Mo. Cloudinary applique la même limite côté upload.
        - Ownership : prestataire **ACCEPTED** sur la mission `{id}`.

        Idempotence : session active existante pour `(missionId, captureClientUuid, variant)`
        → `409 PHOTO_UPLOAD_SESSION_ALREADY_CONSUMED`.

        **Sessions abandonnées (ajustement CTO post-Ticket 3.3)** :
        - Tant que `consumedAt` est **NULL** et `expiresAt` **non dépassé**, la session
          reste « **presignée active** » (le mobile peut encore uploader puis confirmer).
        - Si le mobile **n'upload pas** ou **ne confirme pas** avant `expiresAt`, la ligne
          reste en base avec `consumedAt = NULL` : état **« expirée non consommée** »
          (pas de statut enum dédié MVP). Un `POST /confirm` après expiration → **`410`**
          `PHOTO_UPLOAD_SESSION_EXPIRED`. Le nettoyage Cloudinary + purge DB des orphelins
          est planifié **Ticket 3.5** (`TODO(debt)` `photos-orphan-cleanup-job`).
      x-rbac: [PRESTATAIRE]
      x-rate-limit: { strategy: 'token-bucket', max: 60, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignPhotoUploadInput' }
      responses:
        '201':
          description: PhotoUploadSession créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoUploadSignatureResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '409 — `PHOTO_UPLOAD_SESSION_ALREADY_CONSUMED` (idempotence).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }
        '410': { $ref: '#/components/responses/UploadSessionExpired' }
        '422':
          description: '422 — règle métier (cf. `PhotoErrorCode`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: |
            `PHOTOS_DISABLED` — feature flag `FF_PHOTOS_ENABLED=false` côté serveur
            (PRD-003 Ticket 3.3). Module entièrement désactivé : aucune session créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }

  '/v1/missions/{id}/photos/confirm':
    post:
      tags: [Photos]
      operationId: confirmPhotoUpload
      summary: '[PRESTATAIRE] Confirmer un upload Cloudinary réussi'
      description: |
        Mobile signale que l'upload Cloudinary a réussi. Le serveur :
        1. Vérifie la `PhotoUploadSession` (non consommée ; si `expiresAt` dépassé → **`410 UPLOAD_SESSION_EXPIRED`**).
        2. Vérifie que le `{id}` mission URL = `missionId` de la session (**cross-mission** → `409`).
        3. Vérifie que `captureClientUuid` du body = celui stocké sur la session (**cross-session** / replay → `409 PHOTO_CAPTURE_CLIENT_UUID_SESSION_MISMATCH`).
        4. Vérifie via Cloudinary que l'asset existe ; compare les octets réels Cloudinary au plafond **scellé** sur la session (`maxBytes` du presign) et au plafond ADR-009 10 MiB — dépassement → **`400 PHOTO_MAX_BYTES_EXCEEDED`**.
        5. Crée la ligne `Photo` ; marque la session `consumedAt = NOW()`.

        **Replay `confirm` — `idempotent: true` (ajustement CTO post-Ticket 3.3)** :
        - Dès qu'une `Photo` existe déjà pour `(missionId, captureClientUuid, variant)`,
          tout nouvel appel `POST /confirm` (même session ou après crash réseau) renvoie
          **`201 Created`** avec **`idempotent: true`** dans le corps (pas de second `Photo`,
          pas de mutation si la photo était déjà persistée). Le mobile distingue première
          création (`idempotent: false`) d'un **retry safe** (`idempotent: true`).

        **Important (revue CTO)** : cet appel est **uniquement** « prestataire signale fin upload ».
        Il **ne** valide **pas** la mission côté client (cf. `POST /v1/missions/{id}/validate`).

        Sécurité :
        - `checksumSha256` recalculé / comparé serveur — mismatch → `409 PHOTO_CHECKSUM_MISMATCH`.
        - GPS : cohérence lat/lng (cf. `PhotoGpsInput`).
      x-rbac: [PRESTATAIRE]
      x-rate-limit: { strategy: 'token-bucket', max: 60, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPhotoUploadInput' }
      responses:
        '201':
          description: |
            Photo enregistrée ou **replay idempotent** (ajustement CTO post-Ticket 3.3).
            - **`201`** dans les deux cas (création et replay) — le corps porte la vérité :
              `idempotent: false` = première confirmation (insertion `Photo` + session consommée) ;
              `idempotent: true` = la `Photo` existait déjà pour `(missionId, captureClientUuid, variant)`
              (retry après crash / timeout Cloudinary / double tap) — **aucun side-effect** supplémentaire.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmPhotoUploadResponse' }
        '400':
          description: |
            Erreur de validation Zod **ou** `PHOTO_MAX_BYTES_EXCEEDED` : octets réels de l'asset
            Cloudinary (`getResource`) supérieurs au plafond **scellé** dans `PhotoUploadSession.maxBytes`
            (presign) ou au plafond global 10 MiB (ADR-009).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `PHOTO_CHECKSUM_MISMATCH`, `PHOTO_UPLOAD_SESSION_ALREADY_CONSUMED`,
            `PHOTO_UPLOAD_SESSION_MISSION_MISMATCH`, `PHOTO_CAPTURE_CLIENT_UUID_SESSION_MISMATCH`.
            (Session expirée → **`410`** `UPLOAD_SESSION_EXPIRED`, pas 409.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }
        '410': { $ref: '#/components/responses/UploadSessionExpired' }
        '422':
          description: |
            `PHOTO_INVALID_STATE` — règle métier non satisfaite (asset manquant côté
            Cloudinary, mismatch métadonnées width/height, etc.). Cf. `PhotoErrorCode`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: |
            `PHOTOS_DISABLED` — feature flag `FF_PHOTOS_ENABLED=false` côté serveur.
            Aucun upload accepté tant que le flag n'est pas activé (cf. PRD-003 Ticket 3.3).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }

  '/v1/missions/{id}/photos':
    get:
      tags: [Photos]
      operationId: listMissionPhotos
      summary: '[CLIENT | PRESTATAIRE] Lister les photos d''une mission'
      description: |
        Retourne les `PublicPhoto` (variant **`DISPLAY` uniquement** — jamais `ORIGINAL`
        au client ni au prestataire, même en signed URL courte ; ajustement CTO post-Ticket 3.3).
        Signed URLs régénérées à chaque GET (5 min de validité).

        Ownership vérifié serveur : le client doit être propriétaire, le
        prestataire doit être ACCEPTED.
      x-rbac: [CLIENT, PRESTATAIRE]
      x-rate-limit: { strategy: 'token-bucket', max: 120, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - in: query
