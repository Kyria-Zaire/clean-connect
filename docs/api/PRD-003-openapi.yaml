        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  '/v1/admin/webhooks/dead-letter/{id}/replay':
    post:
      tags: [Webhooks (Admin)]
      operationId: adminReplayWebhookDeadLetter
      summary: '[ADMIN] Replay manuel d''un job DLQ'
      description: |
        Relance le traitement d'un `WebhookDeadLetter` après diagnostic admin.

        **Acteurs autorisés** : `ADMIN` exclusivement (revue CTO state machines rev2 —
        aucun acteur métier ne peut déclencher un replay DLQ).

        **Idempotence** : header `Idempotency-Key` obligatoire (rétention ≥ 24 h). Même clé
        rejouée → 202 idempotent sans déclencher un second traitement Stripe.

        **Traitement asynchrone** : enqueue un job BullMQ avec `jobId` déterministe
        `dlq-replay-{deadLetterId}`. Renvoie 202. Le résultat est observable via
        `GET /v1/admin/webhooks/events` (status passe à `PROCESSED` ou re-`FAILED`).

        **Garde-fous** :
        - `WebhookDeadLetter.resolvedAt != null` → 409 `WEBHOOK_ALREADY_PROCESSED`.
        - Signature originale invalide / payload corrompu → 422 `WEBHOOK_PAYLOAD_MALFORMED` (pas de replay).
      x-rbac: [ADMIN]
      x-rate-limit: { strategy: 'token-bucket', max: 10, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Replay enclenché (traitement async).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedAsyncBody' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '409 — `WEBHOOK_ALREADY_PROCESSED` (DLQ déjà résolue).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookErrorBody' }
        '422':
          description: '422 — `WEBHOOK_PAYLOAD_MALFORMED` (replay refusé).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookErrorBody' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------------------
  # Bloc 4 — Photos (4 endpoints)
  # ---------------------------------------------------------------------------

  '/v1/missions/{id}/photos/presign':
    post:
      tags: [Photos]
      operationId: presignPhotoUpload
      summary: '[PRESTATAIRE] Demander une signed URL Cloudinary'
      description: |
        Émet une `PhotoUploadSession` à usage unique (expire en 5 min).
        Le mobile upload directement à Cloudinary (multipart) avec les
        `cloudinaryParams` retournés — **aucune photo ne transite par l'API**.

        **`captureClientUuid` (revue CTO)** :
        - **Obligatoire** dans le corps ; UUID v4 généré côté mobile.
        - Persisté sur la `PhotoUploadSession` : relie logiquement presign → confirm
          et apparie ORIGINAL/DISPLAY (même valeur pour les deux variants).
        - À `confirm`, le serveur vérifie que `captureClientUuid` du body **égale**
          celui de la session **et** que la session appartient à la mission `{id}` URL
          (anti cross-session / cross-mission).

        Sécurité :
        - `mimeType` validé contre whitelist (`image/jpeg|png|heic|webp`).
        - `bytes` ≤ 10 Mo. Cloudinary applique la même limite côté upload.
        - Ownership : prestataire **ACCEPTED** sur la mission `{id}`.

        Idempotence : session active existante pour `(missionId, captureClientUuid, variant)`
        → `409 PHOTO_UPLOAD_SESSION_ALREADY_CONSUMED`.
      x-rbac: [PRESTATAIRE]
      x-rate-limit: { strategy: 'token-bucket', max: 60, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignPhotoUploadInput' }
      responses:
        '201':
          description: PhotoUploadSession créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoUploadSignatureResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '409 — `PHOTO_UPLOAD_SESSION_ALREADY_CONSUMED` (idempotence).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }
        '410': { $ref: '#/components/responses/UploadSessionExpired' }
        '422':
          description: '422 — règle métier (cf. `PhotoErrorCode`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  '/v1/missions/{id}/photos/confirm':
    post:
      tags: [Photos]
      operationId: confirmPhotoUpload
      summary: '[PRESTATAIRE] Confirmer un upload Cloudinary réussi'
      description: |
        Mobile signale que l'upload Cloudinary a réussi. Le serveur :
        1. Vérifie la `PhotoUploadSession` (non consommée ; si `expiresAt` dépassé → **`410 UPLOAD_SESSION_EXPIRED`**).
        2. Vérifie que le `{id}` mission URL = `missionId` de la session (**cross-mission** → `409`).
        3. Vérifie que `captureClientUuid` du body = celui stocké sur la session (**cross-session** / replay → `409 PHOTO_CAPTURE_CLIENT_UUID_SESSION_MISMATCH`).
        4. Vérifie via Cloudinary que l'asset existe + `checksumSha256` cohérent.
        5. Crée la ligne `Photo` ; marque la session `consumedAt = NOW()`.

        **Important (revue CTO)** : cet appel est **uniquement** « prestataire signale fin upload ».
        Il **ne** valide **pas** la mission côté client (cf. `POST /v1/missions/{id}/validate`).

        Sécurité :
        - `checksumSha256` recalculé / comparé serveur — mismatch → `409 PHOTO_CHECKSUM_MISMATCH`.
        - GPS : cohérence lat/lng (cf. `PhotoGpsInput`).
      x-rbac: [PRESTATAIRE]
      x-rate-limit: { strategy: 'token-bucket', max: 60, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPhotoUploadInput' }
      responses:
        '201':
          description: Photo enregistrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPhoto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `PHOTO_CHECKSUM_MISMATCH`, `PHOTO_UPLOAD_SESSION_ALREADY_CONSUMED`,
            `PHOTO_UPLOAD_SESSION_MISSION_MISMATCH`, `PHOTO_CAPTURE_CLIENT_UUID_SESSION_MISMATCH`.
            (Session expirée → **`410`** `UPLOAD_SESSION_EXPIRED`, pas 409.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }
        '410': { $ref: '#/components/responses/UploadSessionExpired' }
        '422':
          description: '422 — règle métier (cf. `PhotoErrorCode`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoErrorBody' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  '/v1/missions/{id}/photos':
    get:
      tags: [Photos]
      operationId: listMissionPhotos
      summary: '[CLIENT | PRESTATAIRE] Lister les photos d''une mission'
      description: |
        Retourne les `PublicPhoto` (variant `DISPLAY` uniquement). Signed URLs
        régénérées à chaque GET (5 min de validité).

        Ownership vérifié serveur : le client doit être propriétaire, le
        prestataire doit être ACCEPTED.
      x-rbac: [CLIENT, PRESTATAIRE]
      x-rate-limit: { strategy: 'token-bucket', max: 120, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/UuidPathId'
        - in: query
          name: phase
          schema: { $ref: '#/components/schemas/PhotoType' }
        - in: query
          name: variant
          schema: { $ref: '#/components/schemas/PhotoVariant' }
          description: 'Force `DISPLAY` côté client/prestataire (ORIGINAL réservé admin).'
      responses:
        '200':
          description: Liste + counts par phase.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPhotoListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  '/v1/admin/photos':
    get:
      tags: [Photos (Admin)]
      operationId: adminListPhotos
      summary: '[ADMIN] Liste photos avec metadata complète (audit/antifraude)'
      description: |
        Retourne les `AdminPhotoView` (avec `cloudinaryPublicId`, `checksumSha256`,
        `flagSuspicious`, `deletedAt`). Permet variant `ORIGINAL`.
      x-rbac: [ADMIN]
      x-rate-limit: { strategy: 'token-bucket', max: 60, windowSeconds: 60, scope: 'user' }
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - in: query
          name: missionId
          schema: { $ref: '#/components/schemas/Uuid' }
        - in: query
          name: variant
          schema: { $ref: '#/components/schemas/PhotoVariant' }
        - in: query
