          schema: { $ref: '#/components/schemas/PhotoType' }
        - in: query
          name: variant
          schema: { $ref: '#/components/schemas/PhotoVariant' }
          description: 'Force `DISPLAY` côté client/prestataire (ORIGINAL réservé admin).'
      responses:
        '200':
          description: Liste + counts par phase.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPhotoListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  '/v1/admin/photos':
    get:
      tags: [Photos (Admin)]
      operationId: adminListPhotos
      summary: '[ADMIN] Liste photos avec metadata complète (audit/antifraude)'
      description: |
        Retourne les `AdminPhotoView` (avec `cloudinaryPublicId`, `checksumSha256`,
        `flagSuspicious`, `deletedAt`). Permet variant `ORIGINAL`.
      x-rbac: [ADMIN]
      x-rate-limit: { strategy: 'token-bucket', max: 60, windowSeconds: 60, scope: 'user' }
