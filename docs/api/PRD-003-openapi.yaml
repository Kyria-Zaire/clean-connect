      operationId: validatePaymentByAdmin
      summary: '[ADMIN] Forcer la capture manuelle d''un PaymentIntent'
      description: |
        **Cas exceptionnel** — admin force la capture d'un PaymentIntent
        (intervention support, race webhook, etc.).

        - Le flow nominal reste `POST /v1/missions/:id/validate` (client) — qui
          déclenche la capture **en backend** via job BullMQ (jamais HTTP synchrone).
        - Action auditée dans `MissionEvent` avec `adminNote`.
        - Idempotence Stripe garantie via `Idempotency-Key`.
        - **JAMAIS exposé au prestataire ni au client.**

        ### Ownership de la capture (ajustement CTO Ticket 3.2 #4)

        La capture réelle d'un `PaymentIntent` (`stripe.paymentIntents.capture(...)`)
        n'arrive **JAMAIS** au paiement initial (`capture_method='manual'` snapshotté
        à la création — PRD-003 Ticket 3.2). Trois ownerships exclusifs sont autorisés
        à déclencher la capture :

        1. **`SYSTEM`** (job BullMQ déclenché par `POST /v1/missions/:id/validate` côté
           CLIENT) — flow nominal de validation mission. Idempotency key déterministe
           `capture-mission-{missionId}`. Ticket 3.4.
        2. **`SYSTEM`** (job BullMQ déclenché par auto-release T+48h ouvrées si le
           client laisse silence). Même idempotency key. Ticket 3.4 + 3.5.
        3. **`ADMIN` exceptionnel** (cet endpoint `POST /v1/payments/:id/validate`)
           — intervention support quand le flow nominal a échoué (webhook perdu,
           race condition, escalade litige résolue). Audit obligatoire avec `adminNote`.

        Le **prestataire** ne peut **JAMAIS** déclencher une capture, ni directement,
        ni via une route détournée. Le **client** ne peut la déclencher qu'**indirectement**
        via `POST /v1/missions/:id/validate` (qui n'est pas cet endpoint).
      x-rbac: [ADMIN]
