# PRD-004 Ticket 4.1 - Build B. Stack observability.
#
# Lance Prometheus + Grafana en mode local-dev pour visualiser les metriques
# `cleanconnect_*` exposees par l'API NestJS.
#
# Lancement :
#   export METRICS_BEARER_TOKEN=<token-de-API>
#   docker-compose -f docker-compose.observability.yml up -d
#
# Acces :
#   http://localhost:9090 (Prometheus)
#   http://localhost:3001 (Grafana, user=admin pwd=GRAFANA_ADMIN_PASSWORD)
#
# Securite (rappel CTO) :
#   - Reseau intra-cluster uniquement, jamais expose Internet.
#   - METRICS_BEARER_TOKEN doit etre genere par `openssl rand -hex 32` minimum.
#   - GRAFANA_ADMIN_PASSWORD doit etre force (defaut admin/admin refuse).

version: '3.9'

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cc-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-lifecycle'
      - '--enable-feature=expand-external-labels'
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
      PROMETHEUS_ENV: ${PROMETHEUS_ENV:-development}
    ports:
      - '9090:9090'
    networks:
      - cc-observability

  grafana:
    image: grafana/grafana:11.3.0
    container_name: cc-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme-please}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_BASIC_ENABLED: 'true'
      GF_INSTALL_PLUGINS: ''
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'
    networks:
      - cc-observability

volumes:
  prometheus_data:
  grafana_data:

networks:
  cc-observability:
    name: cc-observability
    driver: bridge
