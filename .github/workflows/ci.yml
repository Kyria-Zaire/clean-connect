name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.0'
  PNPM_VERSION: '9.12.3'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality gate — typecheck + lint + format + unit tests
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (typecheck / lint / unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Le typecheck dépend des types générés par Prisma + zod-prisma-types.
      - name: Generate Prisma client
        run: pnpm --filter @cc/api run db:generate

      # TODO(debt): réactiver `pnpm format:check` une fois la dette de formatage
      # antérieure au Sprint 0 traitée dans un ticket dédié (102 fichiers existants
      # non conformes). Ne pas exécuter en CI tant que le baseline n'est pas vert.
      - name: Typecheck (all workspaces)
        run: pnpm typecheck

      - name: Lint (all workspaces)
        run: pnpm lint

      - name: Unit tests (all workspaces)
        run: pnpm test

  # ---------------------------------------------------------------------------
  # 2. Integration tests — Postgres+PostGIS + Redis éphémères
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests (Postgres+PostGIS + Redis)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: cleanconnect_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d cleanconnect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/cleanconnect_test
      DATABASE_URL_TEST: postgresql://test:test@localhost:5433/cleanconnect_test
      REDIS_URL: redis://localhost:6380
      REDIS_URL_TEST: redis://localhost:6380
      APP_ENV: development
      NODE_ENV: development
      JWT_SECRET: ci_jwt_secret_minimum_48_chars_____________________________________________
      JWT_REFRESH_SECRET: ci_refresh_secret_min_48_chars___________________________________________
      CORS_ORIGINS: http://localhost:5173
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cc/api run db:generate

      - name: Apply Prisma migrations
        working-directory: apps/api
        run: pnpm db:migrate:deploy

      - name: Run integration tests
        run: pnpm --filter @cc/api run test:integration

  # ---------------------------------------------------------------------------
  # 3. Build Docker image (vérifie que le Dockerfile API construit)
  # ---------------------------------------------------------------------------
  docker:
    name: Build Docker (api)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: cc-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
