# =============================================================================
# Clean Connect — Docker Compose (dev local)
# -----------------------------------------------------------------------------
# Services :
#   - postgres : PostgreSQL 16 + PostGIS 3.4 (cf. ADR-003), persistant
#   - redis    : Redis 7 avec AOF activé (cf. cahier v1.4 — pas de perte
#                de delayed jobs BullMQ sur restart)
#
# Usage :
#   pnpm db:up      # démarre les services
#   pnpm db:down    # arrête les services (data conservées dans volumes)
# =============================================================================

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: cc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cleanconnect_dev
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: cc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cc -d cleanconnect_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cc-redis
    restart: unless-stopped
    # AOF activé pour persister les delayed jobs BullMQ (cahier v1.4)
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save ""
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    name: cc_postgres_data
  redis_data:
    name: cc_redis_data
